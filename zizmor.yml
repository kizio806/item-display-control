rules:
  unpinned-uses:
    ignore:
      - ci.yml
      - release.yml
      - sonarcloud.yml
      - codeql.yml
      - dependency-review.yml
      - wiki-sync.yml
      - gitleaks.yml
      - workflow-security.yml
  cache-poisoning:
    ignore:
      - ci.yml
      - release.yml
      - sonarcloud.yml
      - codeql.yml
      - dependency-review.yml
      - release.yml
  dependabot-cooldown:
    ignore:
      - dependabot.yml
  hash-pin:
    ignore:
      - ci.yml
      - release.yml
      - sonarcloud.yml
      - codeql.yml
      - dependency-review.yml
      - wiki-sync.yml
      - gitleaks.yml
      - workflow-security.yml
  artipacked:
    ignore:
      - ci.yml
      - release.yml
      - sonarcloud.yml
      - codeql.yml
      - dependency-review.yml
      - wiki-sync.yml
      - gitleaks.yml
      - workflow-security.yml
