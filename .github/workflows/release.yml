name: Release

on:
  push:
    tags:
      - 'v*+mc*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '25'

jobs:
  build-and-release:
    name: Build and Publish Release Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle executable bit
        run: chmod +x ./gradlew

      - name: Read build metadata
        id: metadata
        run: |
          MOD_ID=$(grep '^mod_id=' gradle.properties | cut -d'=' -f2)
          MOD_NAME=$(grep '^mod_name=' gradle.properties | cut -d'=' -f2-)
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          ARTIFACT_BASE_NAME=$(grep '^artifact_base_name=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]' || true)
          [ -z "$ARTIFACT_BASE_NAME" ] && ARTIFACT_BASE_NAME="item-display-control"

          BASE_VERSION="${MOD_VERSION%%+*}"
          MC_METADATA="${MOD_VERSION#*+}"
          MC_RANGE_NAME="${MC_METADATA#mc}"

          FABRIC_VERSIONS=$(grep '^fabric_game_versions=' gradle.properties | cut -d'=' -f2- || true)
          NEOFORGE_VERSIONS=$(grep '^neoforge_game_versions=' gradle.properties | cut -d'=' -f2- || true)
          MODRINTH_VERSIONS=$(grep '^modrinth_game_versions=' gradle.properties | cut -d'=' -f2- || true)

          [ -z "$FABRIC_VERSIONS" ] && FABRIC_VERSIONS="$MODRINTH_VERSIONS"
          [ -z "$NEOFORGE_VERSIONS" ] && NEOFORGE_VERSIONS="$MODRINTH_VERSIONS"
          [ -z "$MODRINTH_VERSIONS" ] && MODRINTH_VERSIONS="$MC_VERSION"

          {
            echo "mod_id=$MOD_ID"
            echo "mod_name=$MOD_NAME"
            echo "artifact_base_name=$ARTIFACT_BASE_NAME"
            echo "mod_version=$MOD_VERSION"
            echo "base_version=$BASE_VERSION"
            echo "mc_metadata=$MC_METADATA"
            echo "mc_range_name=$MC_RANGE_NAME"
            echo "minecraft_version=$MC_VERSION"
            echo "fabric_game_versions=$FABRIC_VERSIONS"
            echo "neoforge_game_versions=$NEOFORGE_VERSIONS"
            echo "modrinth_game_versions=$MODRINTH_VERSIONS"
          } >> "$GITHUB_OUTPUT"

      - name: Compute artifact names
        id: artifacts
        env:
          ARTIFACT_BASE_NAME: ${{ steps.metadata.outputs.artifact_base_name }}
          BASE_VERSION: ${{ steps.metadata.outputs.base_version }}
          MC_METADATA: ${{ steps.metadata.outputs.mc_metadata }}
        run: |
          {
            echo "fabric_jar=fabric/build/libs/${ARTIFACT_BASE_NAME}-${BASE_VERSION}-${MC_METADATA}-fabric.jar"
            echo "neoforge_jar=neoforge/build/libs/${ARTIFACT_BASE_NAME}-${BASE_VERSION}-${MC_METADATA}-neoforge.jar"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize Fabric game versions
        id: fabric_versions
        run: |
          NORMALIZED=$(echo "${{ steps.metadata.outputs.fabric_game_versions }}" \
            | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          if [ -z "$NORMALIZED" ]; then
            echo "No valid Fabric versions found."
            exit 1
          fi
          echo "list<<EOF_LIST" >> "$GITHUB_OUTPUT"
          echo "$NORMALIZED" >> "$GITHUB_OUTPUT"
          echo "EOF_LIST" >> "$GITHUB_OUTPUT"

      - name: Normalize NeoForge game versions
        id: neoforge_versions
        run: |
          NORMALIZED=$(echo "${{ steps.metadata.outputs.neoforge_game_versions }}" \
            | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          if [ -z "$NORMALIZED" ]; then
            echo "No valid NeoForge versions found."
            exit 1
          fi
          echo "list<<EOF_LIST" >> "$GITHUB_OUTPUT"
          echo "$NORMALIZED" >> "$GITHUB_OUTPUT"
          echo "EOF_LIST" >> "$GITHUB_OUTPUT"

      - name: Compute Fabric supported range label
        id: fabric_range
        run: |
          FIRST=$(echo "${{ steps.fabric_versions.outputs.list }}" | head -n1)
          LAST=$(echo "${{ steps.fabric_versions.outputs.list }}" | tail -n1)
          LABEL=$([ "$FIRST" = "$LAST" ] && echo "$FIRST" || echo "$FIRST-$LAST")
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Compute NeoForge supported range label
        id: neoforge_range
        run: |
          FIRST=$(echo "${{ steps.neoforge_versions.outputs.list }}" | head -n1)
          LAST=$(echo "${{ steps.neoforge_versions.outputs.list }}" | tail -n1)
          LABEL=$([ "$FIRST" = "$LAST" ] && echo "$FIRST" || echo "$FIRST-$LAST")
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MOD_VERSION: ${{ steps.metadata.outputs.mod_version }}
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$TAG_VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "Tag must start with 'v' (e.g. v2.0.0+mc26.3.x). Got: ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$MOD_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match mod_version ($MOD_VERSION)."
            exit 1
          fi

      - name: Build all loaders
        run: ./gradlew --no-daemon --stacktrace clean buildAll strictCheck

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MOD_VERSION: ${{ steps.metadata.outputs.mod_version }}
          BASE_VERSION: ${{ steps.metadata.outputs.base_version }}
          MC_RANGE_NAME: ${{ steps.metadata.outputs.mc_range_name }}
          MC_VERSION: ${{ steps.metadata.outputs.minecraft_version }}
          FABRIC_VERSIONS: ${{ steps.metadata.outputs.fabric_game_versions }}
          NEOFORGE_VERSIONS: ${{ steps.metadata.outputs.neoforge_game_versions }}
        run: |
          CURRENT="${GITHUB_REF_NAME}"
          VERSION="${CURRENT#v}"
          CHANGELOG_SECTION="$(mktemp)"

          awk -v heading="## ${VERSION}" '
            $0 == heading { in_section = 1; next }
            /^## / && in_section { exit }
            in_section { print }
          ' CHANGELOG.md > "$CHANGELOG_SECTION"

          if [ ! -s "$CHANGELOG_SECTION" ]; then
            awk -v heading="## [${VERSION}]" '
              $0 == heading { in_section = 1; next }
              /^## / && in_section { exit }
              in_section { print }
            ' CHANGELOG.md > "$CHANGELOG_SECTION"
          fi

          if [ -s "$CHANGELOG_SECTION" ]; then
            NOTES_SOURCE="$CHANGELOG_SECTION"
          else
            PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -v "^${CURRENT}$" | head -n1 || true)
            NOTES_SOURCE="$(mktemp)"

            {
              if [ -n "$PREV" ]; then
                echo "### Changes since ${PREV}"
                git log --pretty='- %s (%h)' "${PREV}..${CURRENT}"
              else
                echo "### Changes"
                git log --pretty='- %s (%h)' "${CURRENT}"
              fi
            } > "$NOTES_SOURCE"
          fi

          {
            echo "## Item Display Control v${BASE_VERSION} — Minecraft ${MC_RANGE_NAME}"
            echo
            echo "- Full project version: ${MOD_VERSION}"
            echo "- Base version: ${BASE_VERSION}"
            echo "- Minecraft compatibility range: ${MC_RANGE_NAME}"
            echo "- Target Minecraft compile version: ${MC_VERSION}"
            echo "- Supported Fabric game versions: ${FABRIC_VERSIONS}"
            echo "- Supported NeoForge game versions: ${NEOFORGE_VERSIONS}"
            echo
            cat "$NOTES_SOURCE"
          } > release-notes.md

      - name: Generate checksums
        run: |
          sha256sum "${{ steps.artifacts.outputs.fabric_jar }}" > fabric/build/libs/FABRIC-SHA256SUMS.txt
          sha256sum "${{ steps.artifacts.outputs.neoforge_jar }}" > neoforge/build/libs/NEOFORGE-SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: itemdisplaycontrol-release-artifacts
          path: |
            ${{ steps.artifacts.outputs.fabric_jar }}
            fabric/build/libs/FABRIC-SHA256SUMS.txt
            ${{ steps.artifacts.outputs.neoforge_jar }}
            neoforge/build/libs/NEOFORGE-SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ steps.metadata.outputs.base_version }} — Minecraft ${{ steps.metadata.outputs.mc_range_name }}"
          body_path: release-notes.md
          files: |
            ${{ steps.artifacts.outputs.fabric_jar }}
            fabric/build/libs/FABRIC-SHA256SUMS.txt
            ${{ steps.artifacts.outputs.neoforge_jar }}
            neoforge/build/libs/NEOFORGE-SHA256SUMS.txt

      - name: Publish to Modrinth - Fabric
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: Item Display Control v${{ steps.metadata.outputs.base_version }} [MC ${{ steps.metadata.outputs.mc_range_name }}] (Fabric)
          version: ${{ steps.metadata.outputs.base_version }}+${{ steps.metadata.outputs.mc_metadata }}.fabric
          version-type: release
          game-versions: ${{ steps.fabric_versions.outputs.list }}
          loaders: fabric
          java: ${{ env.JAVA_VERSION }}
          environment: client
          files: ${{ steps.artifacts.outputs.fabric_jar }}
          changelog-file: release-notes.md

      - name: Publish to Modrinth - NeoForge
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: Item Display Control v${{ steps.metadata.outputs.base_version }} [MC ${{ steps.metadata.outputs.mc_range_name }}] (NeoForge)
          version: ${{ steps.metadata.outputs.base_version }}+${{ steps.metadata.outputs.mc_metadata }}.neoforge
          version-type: release
          game-versions: ${{ steps.neoforge_versions.outputs.list }}
          loaders: neoforge
          java: ${{ env.JAVA_VERSION }}
          environment: client
          files: ${{ steps.artifacts.outputs.neoforge_jar }}
          changelog-file: release-notes.md
