name: Bug report
description: Report a defect in Item Display Control
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please fill all required fields so the issue can be reproduced quickly."

  - type: input
    id: mc_version
    attributes:
      label: Minecraft version
      placeholder: "e.g. 1.21.11"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Mod version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: java_version
    attributes:
      label: Java version
      placeholder: "e.g. 21.0.6"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the observed behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Include enabled target toggles plus whitelist/blacklist values if they matter.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or crash report
      description: Paste a link (gist/pastebin) or the relevant stacktrace fragment.
    validations:
      required: false
